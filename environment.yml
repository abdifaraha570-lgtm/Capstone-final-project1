# Conda environment from the Module 2 plan (docs/module2/Enviroment.yml), kept for reproducibility.
# Pinned per-component requirements live in requirements*.txt, module4/requirements.txt and module5/requirements.txt.
name: jjushycsh-noshow
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - pandas>=2.2
      - numpy>=1.26
      - scikit-learn>=1.5
      - xgboost>=2.1
      - mlflow>=2.15
      - shap>=0.46
      - fairlearn>=0.11
      - streamlit>=1.38
      - matplotlib>=3.9
      - psycopg2-binary>=2.9
      - python-dotenv>=1.0
      - jupyterlab>=4.2
      - dvc>=3.55
      - pytest>=8.0
